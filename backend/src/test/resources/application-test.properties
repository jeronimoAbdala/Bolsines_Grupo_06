# Perfil "test": se suma a src/main/resources/application.properties y pisa solo esto.
# Base H2 EN MEMORIA: el test no toca backend/db (la base de archivo). Se crea al arrancar el
# contexto del test y se borra al terminar; el CargadorDatosDePrueba la llena (base vacia).
spring.datasource.url=jdbc:h2:mem:bolsines-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
