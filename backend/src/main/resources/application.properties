spring.application.name=bolsines-backend
server.port=8080
# Usuario logueado (no hay login todavia: se toma de aca)
bolsines.usuario-logueado=jero
# Origen permitido para el frontend en desarrollo
bolsines.cors.origen=http://localhost:5173

# --- Persistencia: Spring Data JPA + Hibernate + H2 ---
# H2 en modo archivo: crea db/bolsines.mv.db relativo al directorio desde donde se levanta (backend/)
spring.datasource.url=jdbc:h2:file:./db/bolsines
spring.datasource.username=sa
spring.datasource.password=
# Hibernate crea/ajusta las tablas a partir de las entidades sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
# La sesion de JPA dura lo que cada metodo del repositorio: findAll() trae todo lo que usa el CU (listas EAGER)
spring.jpa.open-in-view=false
# Carga de a 16 las documentaciones de los detalles en findAll() (sin esto, una consulta por documentacion)
spring.jpa.properties.hibernate.default_batch_fetch_size=16
# Muestra en consola el SQL que genera Hibernate (solo mientras desarrollamos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Consola web de H2 en http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./db/bolsines, usuario sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
